<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defense Mode | Password Security</title>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='defense.css') }}">
</head>

<body>

<header class="header">
    <h1>🛡 Password Hashing & Strength Checker</h1>
    <p class="tagline">Defensive security for modern authentication</p>
</header>

<nav class="nav">
    <a href="/">Home</a>
    <a href="/attack">Attack</a>
    <a href="/defense" class="active">Defense</a>
</nav>

<div class="container">
    <form method="POST" class="defense-form">

        <label>Enter Password</label>
        <input type="text" name="password" placeholder="Enter password" required>

        <label>Choose Hash Method</label>
        <select name="method" required>
            <option value="sha256">SHA-256</option>
            <option value="bcrypt">bcrypt</option>
        </select>

        <button type="submit">🔐 Hash Password</button>
    </form>

    {% if strength %}
    <div class="results">
        <p>🔋 Password Strength: <strong>{{ strength }}</strong></p>
        <p>🔑 Hashed Output:</p>
        <code>{{ hashed }}</code>
    </div>
    {% endif %}
</div>

<footer class="footer">
    <a href="/">⬅ Back to Home</a>
    <p>© 2025 Password Security Toolkit</p>
</footer>

</body>
</html>
